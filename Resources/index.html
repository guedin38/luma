<style>
:root{--bg:#faf5ee;--card:#fffdf8;--tx:#3a2a2c;--mut:#8f7e7b;--ln:#eadfd3;--ac:#b36b7d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#211a1b;--card:#2b2223;--tx:#f4ebe6;--mut:#a69590;--ln:#3d3032}}
:root[data-theme="dark"]{--bg:#211a1b;--card:#2b2223;--tx:#f4ebe6;--mut:#a69590;--ln:#3d3032}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}h1{font-size:28px;margin-bottom:14px}h2{font-size:18px;margin-bottom:8px}
html,body{height:100%;height:100dvh;overflow:hidden}#main{height:100%;max-width:900px;margin:auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px));overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}#main::-webkit-scrollbar,#nav::-webkit-scrollbar{display:none}#nav{scrollbar-width:none}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:0 0 auto;background:none;border:0;color:var(--mut);font:11px 'DM Sans';padding:4px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button span{font-size:20px}#nav .on{color:var(--tx);background:var(--bg);font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.grid .card{margin:0}
button,.btn{font:inherit;cursor:pointer;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px}
button.ghost{background:none;color:var(--mut);border:1px solid var(--ln)}button.x{background:none;color:var(--mut);padding:2px 8px}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
input[type=color]{padding:2px;height:38px}input[type=checkbox]{width:auto}input[type=range]{padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:13px}
.mod{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}.sheet .row{justify-content:flex-end;margin-top:14px}
.it{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}.it.d span{text-decoration:line-through;color:var(--mut)}.it span{flex:1}
.pill{padding:5px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);color:var(--tx)}.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal i{font-style:normal;font-size:12px;color:var(--mut)}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;min-height:40px}
.cal .td{border:1.5px solid var(--ac)}.cal .sel{background:var(--ac);color:#fff}.cal u{display:flex;gap:2px;height:5px}.cal b{width:5px;height:5px;border-radius:50%}
.ev{border-left:4px solid;padding:6px 10px;margin:6px 0;background:var(--bg);border-radius:8px;display:flex;align-items:center;gap:8px}.ev div{flex:1}
.cover{height:110px;border-radius:14px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;color:#fff;font-size:22px;text-shadow:0 1px 6px #0006;margin-bottom:10px}
.big{font-family:Fraunces,serif;font-size:52px;text-align:center;margin:10px 0}.moods{display:flex;gap:6px;justify-content:space-between}.moods button{font-size:26px;background:var(--bg);border:1px solid var(--ln);flex:1;padding:6px}.moods .on{border-color:var(--ac);background:var(--card)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.q{font-family:Fraunces,serif;font-size:20px;line-height:1.3}
input,select,textarea{font-size:16px}*{-webkit-tap-highlight-color:transparent}button,input{touch-action:manipulation}
.card{box-shadow:0 1px 2px #0000000a,0 8px 24px -14px #00000030;transition:transform .2s;animation:in .35s ease both;border-radius:18px}.card[onclick]{cursor:pointer}.card[onclick]:hover{transform:translateY(-2px)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:active{transform:scale(.97)}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}h1{letter-spacing:-.02em;font-size:32px}h2{font-size:19px}
#nav button{border-radius:14px;transition:background .2s}#nav .on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.moods .on{transform:scale(1.08);box-shadow:0 0 0 2px var(--ac)}.cover{height:130px}.card:has(.q){background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.it{padding:9px 0}.it:last-child{border-bottom:0}.ev{border-radius:10px}.cal div:hover{background:color-mix(in srgb,var(--ac) 14%,var(--bg))}
@media(min-width:700px){.mod{align-items:center}.sheet{border-radius:20px}}
@media(min-width:900px) and (min-height:560px){body{padding-left:104px}#nav{top:0;right:auto;width:104px;flex-direction:column;overflow-x:hidden;overflow-y:auto;border-top:0;border-right:1px solid var(--ln);padding:calc(16px + env(safe-area-inset-top,0px)) 8px}#nav button{padding:10px 4px}#main{padding-bottom:40px}}
body{background-image:radial-gradient(var(--ln) 1px,transparent 1.3px);background-size:20px 20px}
.lbl,.card h2{font:600 11.5px 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase}.card h2{color:var(--ac)}.lbl{color:var(--mut)}
.card.book h2{font:600 19px Fraunces,Georgia,serif;letter-spacing:0;text-transform:none;color:var(--tx)}
.hero{height:150px;border-radius:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 24px -14px #0003}
.hero::after{content:'';position:absolute;top:12px;right:-14px;width:96px;height:22px;background:#fffdf6b0;transform:rotate(10deg)}
.logo,.lab{background:#fffdf6;color:#3a2326;border:1.5px solid #3a2326;border-radius:8px;box-shadow:0 0 0 4px #fffdf666;font-family:Fraunces,serif}
.logo{position:absolute;left:16px;bottom:14px;padding:6px 16px;font-size:26px;font-weight:600;letter-spacing:.2em}.lab{padding:8px 14px;text-align:center;font-size:17px;font-weight:600;max-width:82%}
.nbg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.nb{aspect-ratio:3/4;border-radius:6px 14px 14px 6px;border-left:14px solid #3a2326;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 22px -14px #0006;transition:transform .2s}.nb:hover{transform:translateY(-3px) rotate(-.6deg)}
.cover{height:140px;color:#3a2326;text-shadow:none}
.book{display:flex;gap:12px}.book>div:last-child{flex:1}
.bk{flex:0 0 78px;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;border-left:8px solid #3a2326;display:flex;align-items:center;text-align:center;font:600 11px Fraunces,serif;padding:4px;color:#3a2326}.bk span{flex:1}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--ac)}
.stars{color:var(--ac);letter-spacing:2px}.qt{font:italic 15px Fraunces,serif;color:var(--mut)}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}.it .wk{flex:0 0 auto;display:flex;gap:4px}
.cal .sel{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 2px var(--ac)}.cal .td{background:var(--ac);color:#fff;border:0}
.imgs img{border:5px solid #fffdf6;border-bottom-width:16px;border-radius:3px;box-shadow:0 6px 14px -8px #0005}.imgs>:nth-child(even){transform:rotate(1.2deg)}
details{border-top:1px solid var(--ln);padding:8px 0}summary{cursor:pointer}
body{font-size:14px}h1{font-size:25px;margin-bottom:10px}.card{padding:12px;margin-bottom:10px}
.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.grid:has(>.book){grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.nbg{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.hero{height:92px;margin-bottom:10px}.logo{font-size:20px;padding:4px 12px;bottom:10px}
.cal div{aspect-ratio:1.15;min-height:34px}.it{padding:6px 0}.cover{height:110px}
.ico{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}.moods .ico{width:1.1em;height:1.1em}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.nbg{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.hero{height:130px}}
#sb{position:fixed;right:2px;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:5px;opacity:0;transition:opacity .35s;pointer-events:none;z-index:5}#sb.on{opacity:1}#sb i{display:block;width:100%;border-radius:9px;background:var(--ac)}
@media(min-width:900px) and (min-height:560px){#sb{bottom:10px}}

grades(){const all=avg(S.grades);return `<h1>Notes</h1><div class="card"><h2>Moyenne générale</h2><div class="big" style="font-size:40px;text-align:left;margin:4px 0">${all==null?'–':all.toFixed(2)}<span class="mut" style="font-size:16px"> /20</span></div></div><div class="grid">${S.courses.map(c=>{const a=S.grades.filter(g=>g.c==c.id),m=avg(a);return `<div class="card"><div class="row sp"><h2>${ic(c.i)} ${esc(c.n)}</h2><b>${m==null?'–':m.toFixed(1)}</b></div>${a.map(g=>`<div class="it"><span>${esc(g.n)} <span class="mut">coef ${g.k}</span></span><b>${g.v}/${g.m}</b><button class="x" onclick="S.grades=S.grades.filter(x=>x.id!=${g.id});save();render()">✕</button></div>`).join('')}<div class="row" style="margin-top:8px"><button class="pill" onclick="gradeAdd(${c.id})">+ Note</button>${a.length?`<button class="pill" onclick="need(${c.id})">Note à viser</button><button class="pill" onclick="whatif(${c.id})">Et si ?</button>`:''}</div></div>`}).join('')||'<p class="mut">Crée d’abord un cours.</p>'}</div>`},

return `<div class="row sp"><h1>Fiches</h1><button onclick="cardAdd()">+ Fiche</button></div><div class="card row sp"><div><h2>Aujourd’hui</h2><p>${due.length} fiche${due.length>1?'s':''} à réviser</p></div>${due.length?`<button onclick="cur.rv={l:due.map(x=>x.id).sort(()=>Math.random()-.5),i:0};render()">Réviser</button>`:''}</div><div class="grid">${S.courses.map(c=>{const a=S.cards.filter(x=>x.c==c.id);return a.length?`<div class="card"><h2>${ic(c.i)} ${esc(c.n)}</h2>${a.map(x=>`<div class="it"><span>${esc(x.q)}</span><span class="mut" style="flex:0 0 auto">${'●'.repeat(x.b)}${'○'.repeat(4-x.b)}</span><button class="x" onclick="S.cards=S.cards.filter(y=>y.id!=${x.id});save();render()">✕</button></div>`).join('')}</div>`:''}).join('')||'<p class="mut">Crée une fiche : question au recto, réponse au verso.</p>'}</div>`},
books(){const f=cur.bf||'Tous',lu=S.books.filter(b=>b.st=='Lu').length,g=S.bgoal||12,list=S.books.filter(b=>f=='Tous'||b.st==f);
return `<div class="row sp"><h1>Lectures</h1><span class="row acts"><button class="ghost" onclick="scanBook()">Scanner</button><button class="ghost" onclick="bsearch()">Rechercher</button><button onclick="book()">+ Livre</button></span></div><div class="card row sp"><div><h2>Objectif ${new Date().getFullYear()}</h2><p class="mut">${lu} lu${lu>1?'s':''} sur ${g}</p><button class="ghost" onclick="ask('Objectif de lecture',[{k:'g',l:'Livres à lire cette année',t:'number',v:g}],o=>{S.bgoal=+o.g||12;save();render()})">Modifier</button></div>${ring(Math.min(100,Math.round(lu/g*100)),90)}</div><div class="row" style="margin-bottom:12px">${['Tous','À lire','En cours','Lu'].map(x=>`<button class="pill ${x==f?'on':''}" onclick="cur.bf='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${list.map(b=>{const pg=b.st=='Lu'?b.n:b.p||0;return `<div class="card book"><div class="bk" style="background:${b.cov?`url('${b.cov}') center/cover`:pat('Rayures','#f3d9d6','#e6bcc0')}">${b.cov?'':`<span>${esc(b.t)}</span>`}</div><div><h2>${esc(b.t)}</h2><div class="mut">${esc(b.a||'')} · ${b.st}</div><div class="stars">${'★'.repeat(+b.r||0)}${'☆'.repeat(5-(+b.r||0))}</div>${+b.n?`<div class="bar"><i style="width:${Math.min(100,Math.round(pg/b.n*100))}%"></i></div><div class="mut">${pg}/${b.n} pages${b.f&&b.st=='En cours'?` · ${Math.ceil(Math.max(0,b.n-pg)/Math.max(1,Math.ceil((new Date(b.f)-new Date(TD()))/864e5)))} p/jour`:''}</div>`:''}${b.q?`<p class="qt">“${esc(b.q)}”</p>`:''}${b.rv?`<p>${esc(b.rv)}</p>`:''}<div class="row"><button class="pill" onclick="book(S.books.find(x=>x.id==${b.id}))">✏️</button><button class="pill" onclick="bookQR(${b.id})">QR</button><button class="pill" onclick="pic(s=>{S.books.find(x=>x.id==${b.id}).cov=s;save();render()})">🖼️</button><button class="x" onclick="S.books=S.books.filter(x=>x.id!=${b.id});save();render()">✕</button></div></div></div>`}).join('')||'<p class="mut">Ajoute ton premier livre 📖</p>'}</div>`},
home(){const t=TD(),per=S.per.find(p=>p.s<=t&&t<=p.e),up=[];for(let i=0;i<14&&up.length<3;i++){const d=iso(new Date(Date.now()+i*864e5));evOn(d).forEach(e=>up.length<3&&up.push([d,e]))}
const m=S.mood[t]?.m;return `<div class="hero" style="background:${hbg()}"><span class="logo">LUMA</span></div><div class="row sp"><div><div class="lbl">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${new Date().getHours()<18?'Bonjour':'Bonsoir'} ✨</h1></div><span class="row"><button class="ghost" onclick="searchAsk()">🔎</button><button class="ghost" onclick="settings()">⚙</button></span></div>
${per?`<p class="mut">${ic(per.i)} Période en cours : <b>${esc(per.n)}</b></p>`:''}
${AU?'':`<div class="card" onclick="go('acct')"><h2>Synchronisation</h2><p>Crée ton compte pour retrouver LUMA sur tous tes appareils.</p></div>`}<div class="card" onclick="ask('Phrase de la semaine',[{k:'q',l:'Phrase',v:S.quote}],o=>{S.quote=o.q;save();render()})"><div class="q">“${esc(S.quote)}”</div></div>
<div class="grid"><div class="card"><h2>✅ Aujourd’hui</h2>${L0().it.filter(i=>!i.d).slice(0,3).map(i=>`<div class="it"><input type="checkbox" onchange="tg(${L0().id},${i.id})"><span>${esc(i.t)}</span></div>`).join('')||'<p class="mut">Tout est fait 🎉</p>'}</div>
<div class="card"><h2>📅 À venir</h2>${up.map(([d,e])=>`<div class="ev" style="border-color:${S.cats[e.cat]||'#999'}"><div><b>${esc(e.t)}</b><div class="mut">${d.slice(8)}/${d.slice(5,7)} ${esc(e.h||'')}</div></div></div>`).join('')||'<p class="mut">Rien de prévu.</p>'}</div>
<div class="card"><h2>🎯 Objectifs de la semaine</h2>${S.goals.w.filter(g=>!g.d).slice(0,3).map(g=>`<div class="it"><span>${esc(g.t)}</span></div>`).join('')||'<p class="mut">Définis-les dans Objectifs.</p>'}</div>
<div class="card row sp"><div><h2>📊 Régularité</h2><div class="mut">⏱️ ${fmt(tot(ses(7)))} cette semaine<br>Aujourd’hui : ${fmt(tot(S.ses.filter(s=>s.d==t)))}</div></div>${ring(cons(7).all,90)}</div>
<div class="card"><h2>😊 Mood du jour</h2><div class="moods">${MO.map((e,i)=>`<button class="${m==i+1?'on':''}" onclick="setMood(${i+1})">${e}</button>`).join('')}</div></div>
${(()=>{const b=S.books.find(x=>x.st=='En cours');return b?`<div class="card" onclick="go('books')"><h2>📖 En cours de lecture</h2><b>${esc(b.t)}</b><div class="mut">${esc(b.a||'')}</div>${+b.n?`<div class="bar"><i style="width:${Math.min(100,Math.round((b.p||0)/b.n*100))}%"></i></div>`:''}</div>`:''})()}<div class="card" onclick="go('mood')"><h2>🖼️ ${esc(S.mb.t)}</h2><div class="imgs">${mbThumbs()}</div><p class="mut">${esc(S.mb.w)}</p></div></div>
<div class="card"><h2>🧠 Brain dump</h2><input placeholder="Écris n’importe quoi, puis Entrée…" onkeydown="if(event.key=='Enter')inboxAdd(this)">${S.inbox.slice(-2).map(i=>`<div class="it"><span>${esc(i.t)}</span><button class="pill" onclick="inboxTo(${i.id},'t')">Tâche</button><button class="pill" onclick="inboxTo(${i.id},'e')">Date</button><button class="x" onclick="inboxTo(${i.id},'x')">✕</button></div>`).join('')}</div>
<button onclick="reset()">🔄 Weekly reset</button>`},
cal(){const v=cur.cv||'Mois',sd=cur.cd||TD(),d0=new Date(sd);let b='';
if(v=='Mois'){const y=d0.getUTCFullYear(),mo=d0.getUTCMonth(),off=(new Date(Date.UTC(y,mo,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
b=`<div class="cal">${'LMMJVSD'.split('').map(x=>`<i>${x}</i>`).join('')}${'<span></span>'.repeat(off)}${Array.from({length:n},(_,i)=>{const ds=ymd(y,mo,i+1);return `<div class="${ds==TD()?'td':''} ${ds==sd?'sel':''}" onclick="cur.cd='${ds}';render()">${i+1}<u>${evOn(ds).slice(0,4).map(e=>`<b style="background:${S.cats[e.cat]||'#999'}"></b>`).join('')}</u></div>`}).join('')}</div><div style="margin-top:14px">${dayList(sd)}</div>`}
else if(v=='Semaine'){const s=new Date(d0);s.setUTCDate(s.getUTCDate()-(s.getUTCDay()+6)%7);b=Array.from({length:7},(_,i)=>{const x=new Date(s);x.setUTCDate(x.getUTCDate()+i);return `<div class="card">${dayList(x.toISOString().slice(0,10))}</div>`}).join('')}
else if(v=='Planning'){b=`<div class="grid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map((n,i)=>`<div class="card"><h2>${n}</h2>${S.ev.filter(x=>x.r=='Chaque semaine'&&(new Date(x.d).getUTCDay()+6)%7==i).sort((a,b)=>(a.h||'').localeCompare(b.h||'')).map(x=>`<div class="ev" style="border-color:${S.cats[x.cat]||'#999'}"><div><b>${esc(x.h||'')} ${esc(x.t)}</b><div class="mut">${esc(x.cat)}${x.du?' · '+x.du+' min':''}</div></div></div>`).join('')||'<p class="mut">—</p>'}</div>`).join('')}</div><button onclick="addEv(TD(),{r:'Chaque semaine'})">+ Cours récurrent</button>`}else if(v=='Jour'){b=hours(sd)}else b=`<div class="card">${dayList(sd)}</div>`;
return `<h1>Agenda</h1><div class="row sp"><div class="row">${sel(['Mois','Semaine','Jour','Planning'],'cv')}</div><div class="row"><button class="ghost" onclick="shift(-1)">‹</button><button class="ghost" onclick="cur.cd=null;render()">Aujourd’hui</button><button class="ghost" onclick="shift(1)">›</button></div></div><h2 style="margin-top:12px;text-transform:capitalize">${d0.toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'})}</h2>${b}<div class="card"><h2>🎨 Catégories</h2><div class="row">${Object.entries(S.cats).map(([k,c],i)=>`<button class="pill" style="border-left:8px solid ${c}" onclick="catEdit(${i})">${esc(k)}</button>`).join('')}<button onclick="addCat()">+</button></div></div><div class="row"><button class="ghost" onclick="exam()">Mode examen</button><button class="ghost" onclick="remOn()">Rappels</button><button class="ghost" onclick="icsExp()">Exporter .ics</button><button class="ghost" onclick="icsImp()">Importer .ics</button></div>`},
tasks(){return `<div class="row sp"><h1>Tâches</h1><button onclick="ask('Nouvelle liste',[{k:'n',l:'Nom'}],o=>{if(o.n){S.lists.push({id:uid(),n:o.n,it:[]});save();render()}})">+ Liste</button></div><div class="grid">${S.lists.map(l=>`<div class="card"><div class="row sp"><h2>${esc(l.n)}</h2><button class="x" onclick="if(confirm('Supprimer la liste ?')){S.lists=S.lists.filter(x=>x.id!=${l.id});save();render()}">🗑</button></div>${l.it.map(i=>`<div class="it ${i.d?'d':''}"><input type="checkbox" ${i.d?'checked':''} onchange="tg(${l.id},${i.id})"><span>${esc(i.t)}</span><button class="x" title="Mettre à l’agenda" onclick="addEv(TD(),{t:L(${l.id}).it.find(x=>x.id==${i.id}).t})">📅</button><button class="x" onclick="L(${l.id}).it=L(${l.id}).it.filter(x=>x.id!=${i.id});save();render()">✕</button></div>`).join('')}<input style="margin-top:8px" placeholder="+ Ajouter" onkeydown="if(event.key=='Enter')addIt(${l.id},this)"></div>`).join('')}</div>`},
studies(){if(cur.course){const c=S.courses.find(x=>x.id==cur.course);return `<button class="ghost" onclick="cur.course=null;render()">‹ Cours</button><div class="cover" style="margin-top:10px;background:${cov(c)};font-family:${FONTS[c.f]}"><span class="lab">${ic(c.i)} ${esc(c.n)}</span></div><div class="row" style="margin-bottom:12px"><button class="ghost" onclick="crs(S.courses.find(x=>x.id==${c.id}))">✏️ Apparence</button><button class="ghost" onclick="pic(s=>{S.courses.find(x=>x.id==${c.id}).cov=s;save();render()})">🖼️ Photo</button>${c.cov?`<button class="ghost" onclick="delete S.courses.find(x=>x.id==${c.id}).cov;save();render()">Retirer la photo</button>`:''}<button class="ghost" onclick="if(confirm('Supprimer ce cours ?')){S.courses=S.courses.filter(x=>x.id!=${c.id});cur.course=null;save();render()}">🗑</button></div>${seances(c)}<div class="grid">${Object.keys(c.sec).filter(k=>!['Cours','TD'].includes(k)||c.sec[k].length).map(k=>`<div class="card" style="border-top:4px solid ${c.c2}"><div class="row sp"><h2 style="font-family:${FONTS[c.f]}">${{Cours:'📖',TD:'📝',Documents:'📎',Deadlines:'📌'}[k]} ${k}</h2><button class="pill" onclick="addSec(S.courses.find(x=>x.id==${c.id}),'${k}')">${k=='Documents'?'Importer':'+'}</button></div>${c.sec[k].map((t,i)=>`<div class="it"><span>${t.id?`<a href="#" onclick="viewF(${t.id});return false" style="color:var(--ac)">${esc(t.n)}</a> <span class="mut">${Math.round(t.sz/1024)} Ko</span>`:esc(t)}</span><button class="x" onclick="delF(${c.id},'${k}',${i})">✕</button></div>`).join('')}</div>`).join('')}</div><div class="card"><h2 style="font-family:${FONTS[c.f]}">✏️ Notes</h2>${rtb()}<div class="rte" contenteditable="true" data-k="n:${c.id}" oninput="rsave(this)" onpaste="rpaste(event)">${rh(c.notes)}</div></div><div class="card"><div class="row sp"><h2>Photos du cours</h2><button onclick="pic(s=>{const k=S.courses.find(x=>x.id==${c.id});(k.ph=k.ph||[]).push(s);save();render()},1100)">+ Photo</button></div><div class="imgs">${(c.ph||[]).map((s,i)=>`<div style="position:relative"><img src="${s}"><button class="x" style="position:absolute;top:2px;right:2px;background:#0007;color:#fff" onclick="S.courses.find(x=>x.id==${c.id}).ph.splice(${i},1);save();render()">✕</button></div>`).join('')}</div></div><button class="ghost" onclick="notePDF(${c.id})">Exporter les notes en PDF</button>`}
const y=cur.yr||S.years[0];return `<div class="row sp"><h1>Cours</h1><button onclick="crs()">+ Cours</button></div><div class="row" style="margin-bottom:12px">${S.years.map(a=>`<button class="pill ${a==y?'on':''}" onclick="cur.yr='${a}';render()">${a}</button>`).join('')}<button class="pill" onclick="ask('Nouvelle année',[{k:'y',l:'Ex : 2027–2028'}],o=>{if(o.y){S.years.push(o.y);cur.yr=o.y;save();render()}})">+ année</button></div>${['Semestre 1','Semestre 2'].map(s=>`<h2>${s}</h2><div class="grid nbg" style="margin-bottom:18px">${S.courses.filter(c=>c.y==y&&c.s==s).map(c=>`<div class="nb" style="background:${cov(c)}" onclick="cur.course=${c.id};render()"><div class="lab" style="font-family:${FONTS[c.f]}">${ic(c.i)}<br>${esc(c.n)}</div></div>`).join('')||'<p class="mut">Aucun cours.</p>'}</div>`).join('')}`},
goals(){const N={y:'🎓 Objectifs de l’année',m:'🌙 Objectifs du mois',w:'☀️ Objectifs de la semaine'};return `<h1>Objectifs</h1><div class="grid">${Object.keys(N).map(k=>`<div class="card"><h2>${N[k]}</h2>${S.goals[k].map(g=>`<div class="it ${g.d?'d':''}"><input type="checkbox" ${g.d?'checked':''} onchange="gtg('${k}',${g.id})"><span>${esc(g.t)}</span><button class="x" onclick="S.goals.${k}=S.goals.${k}.filter(x=>x.id!=${g.id});save();render()">✕</button></div>`).join('')}<input style="margin-top:8px" placeholder="+ Ajouter" onkeydown="if(event.key=='Enter'&&this.value.trim()){S.goals.${k}.push({id:uid(),t:this.value.trim(),d:0});save();render()}"></div>`).join('')}</div><div class="card"><div class="row sp"><h2>📅 Périodes de l’année</h2><button onclick="ask('Nouvelle période',[{k:'n',l:'Nom (Winter Arc, Révisions…)'},{k:'i',l:'Icône',t:'select',o:ICO},{k:'s',l:'Début',t:'date'},{k:'e',l:'Fin',t:'date'}],o=>{if(o.n&&o.s&&o.e){S.per.push(o);save();render()}})">+</button></div>${S.per.map((p,i)=>`<div class="it"><span>${ic(p.i)} ${esc(p.n)} <span class="mut">${p.s} → ${p.e}</span></span><button class="x" onclick="S.per.splice(${i},1);save();render()">✕</button></div>`).join('')}</div>`},
focus(){const t=S.timer,w=ses(7),by={};w.forEach(s=>by[s.c]=(by[s.c]||0)+s.min);return `<h1>Focus</h1><div class="card"><div class="big" id="clk">00:00:00</div><div id="ph" class="mut" style="text-align:center"></div>${t?`<p class="mut" style="text-align:center">${esc(t.c)}</p><button style="width:100%" onclick="stopT()">Terminer la session</button>`:`<select id="fc"><option>Général</option>${S.courses.map(c=>`<option>${esc(c.n)}</option>`).join('')}</select><label class="row" style="margin-top:10px"><input type="checkbox" ${S.pomo?'checked':''} onchange="S.pomo=this.checked;save()"> Mode Pomodoro (25 min + 5 min)</label><button style="width:100%;margin-top:10px" onclick="startT()">▶ START STUDY SESSION</button>`}</div><div class="card"><h2>Ambiance</h2><div class="row"><button class="pill" onclick="amb('pluie')">Pluie</button><button class="pill" onclick="amb('blanc')">Bruit blanc</button><button class="pill" onclick="amb('mer')">Mer</button><button class="pill" onclick="amb()">Stop</button><button class="pill" onclick="zen()">Mode zen</button></div><label class="row" style="margin-top:10px">Volume<input type="range" min="0" max="1" step="0.01" value="${vol()}" oninput="setVol(this.value)" style="flex:1"></label></div><div class="grid"><div class="card"><div class="mut">Cette semaine</div><h2>📚 ${fmt(tot(w))}</h2></div><div class="card"><div class="mut">Ce mois</div><h2>📚 ${fmt(tot(ses(30)))}</h2></div></div><div class="card" style="margin-top:12px"><h2>Par cours (semaine)</h2>${Object.entries(by).map(([c,m])=>`<div class="it"><span>${esc(c)}</span><b>${fmt(m)}</b></div>`).join('')||'<p class="mut">Aucune session.</p>'}<button class="ghost" style="margin-top:10px" onclick="ask('Session manuelle',[{k:'m',l:'Minutes',t:'number',v:60},{k:'c',l:'Cours',t:'select',o:['Général',...S.courses.map(c=>c.n)]}],o=>{S.ses.push({id:uid(),d:TD(),min:+o.m,c:o.c});save();render()})">+ Ajouter une session</button></div>`},
prog(){const P={Semaine:7,Mois:30,Semestre:120,Année:365},N=P[cur.pp||'Semaine'],c=cons(N),s=ses(N);return `<h1>Progrès</h1><div class="row" style="margin-bottom:12px">${sel(Object.keys(P),'pp')}</div>${wr()}${wrap()}<div class="card" style="text-align:center"><div class="mut">CONSISTENCY</div>${ring(c.all,170)}<p class="mut">Pas de culpabilité : l’important, c’est la tendance.</p></div><div class="card"><h2>Par habitude</h2>${c.hs.map(x=>`<div class="it"><span>${ic(x.h.i)} ${esc(x.h.n)}</span><b>${x.p}%</b></div>`).join('')}</div><div class="grid"><div class="card"><div class="mut">Travail</div><h2>📚 ${fmt(tot(s))}</h2></div><div class="card"><div class="mut">Sessions</div><h2>⏱️ ${s.length}</h2></div><div class="card"><div class="mut">Humeur moyenne</div><h2>😊 ${avgMood(N)}/10</h2></div><div class="card"><div class="mut">Tâches terminées (total)</div><h2>✓ ${S.done}</h2></div></div><div class="card" style="margin-top:12px"><h2>MY SCHOOL YEAR</h2><p>${fmt(tot(S.ses))} étudiées · ${S.ses.length} sessions · ${S.done} tâches terminées</p></div>`},

function iconize(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(n=>{if(/^(TEXTAREA|OPTION|SCRIPT|STYLE|TITLE)$/.test(n.parentNode.nodeName)||(n.parentNode.closest&&n.parentNode.closest('.rte')))return;const v=n.nodeValue.replace(/\uFE0F/g,'');if(!EMT.test(v))return;const sp=document.createElement('span');sp.innerHTML=esc(v).replace(EMG,m=>svg(EMO[m]));n.replaceWith(...sp.childNodes)})}
const mo=new MutationObserver(()=>{mo.disconnect();iconize();mo.observe(document.body,{childList:true,subtree:true})});mo.observe(document.body,{childList:true,subtree:true});
